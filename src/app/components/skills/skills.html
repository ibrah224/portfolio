<section id="competences">
    <h2>Mes <span>compétences</span></h2>
    <div class="groups">
      @for (g of groups; track g.title) {
        <div class="group">
          <h3>{{ g.title }}</h3>
          <div class="chips">
            @for (item of g.items; track item) {
              <span>{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </section>
